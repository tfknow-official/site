<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tfknow - Karaoke</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Полноэкранные обои с темным градиентом поверх */
            background: linear-gradient(rgba(13, 17, 23, 0.75), rgba(13, 17, 23, 0.92)), 
                        url('https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: rgba(22, 27, 34, 0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
        }
        .profile-block {
            margin-bottom: 25px;
        }
        .avatar-container {
            width: 85px;
            height: 85px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #58a6ff;
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.3);
            background: #21262d;
        }
        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            color: #f0f6fc;
            font-size: 1.6rem;
            margin-bottom: 4px;
        }
        .tagline {
            color: #8b949e;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }
        .views-counter {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(13, 17, 23, 0.7);
            border: 1px solid #30363d;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #8b949e;
        }
        .views-counter svg {
            width: 15px;
            height: 15px;
            fill: #58a6ff;
        }
        .views-counter span {
            color: #f0f6fc;
            font-weight: bold;
        }

        /* Блок с текстом под профилем */
        .lyrics-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lyrics-container {
            font-size: 1.1rem;
            color: #484f58;
            text-align: center;
            line-height: 1.5;
            flex-wrap: wrap;
            gap: 6px;
            display: flex;
            justify-content: center;
        }
        .word {
            transition: color 0.15s ease, text-shadow 0.15s ease;
        }
        .word.active {
            color: #58a6ff;
            font-weight: 700;
            text-shadow: 0 0 12px rgba(88, 166, 255, 0.6);
        }
        footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #484f58;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Верхний блок профиля -->
        <div class="profile-block">
            <div class="avatar-container">
                <img src="https://github.com/tfknow.png" alt="Аватарка tfknow">
            </div>

            <h1>tfknow</h1>
            <div class="tagline">Разработчик • Автоматизация • TTML</div>
            
            <div class="views-counter">
                <svg viewBox="0 0 24 24">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
                <span id="view-count">1</span>
            </div>
        </div>

        <!-- Блок TTML-караоке под профилем -->
        <div class="lyrics-box">
            <div class="lyrics-container" id="lyrics">
                <span style="color: #8b949e;">Загрузка текста...</span>
            </div>
        </div>

        <footer>
            &copy; 2026 tfknow
        </footer>
    </div>

    <script>
        // Счётчик просмотров
        fetch('https://api.counterapi.dev/v1/tfknow_site/visits/up')
            .then(res => res.json())
            .then(data => {
                if (data && data.count) {
                    document.getElementById('view-count').textContent = data.count;
                }
            })
            .catch(() => {});

        let linesData = [];
        const lyricsEl = document.getElementById('lyrics');
        let startTime = 0;
        let isStarted = false;

        function parseTime(tStr) {
            if (!tStr) return 0;
            if (tStr.includes(':')) {
                let parts = tStr.split(':');
                return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
            }
            return parseFloat(tStr);
        }

        // Автоматическая загрузка TTML и запуск воспроизведения при входе
        fetch('lyrics.ttml')
            .then(response => response.text())
            .then(ttmlString => {
                const parser = new window.DOMParser();
                const xmlDoc = parser.parseFromString(ttmlString, "text/xml");
                const pNodes = xmlDoc.getElementsByTagName('p');
                
                for (let p of pNodes) {
                    let lineBegin = parseTime(p.getAttribute('begin')) || 0;
                    let lineEnd = parseTime(p.getAttribute('end')) || 9999;
                    let spanNodes = p.getElementsByTagName('span');
                    let words = [];

                    if (spanNodes.length > 0) {
                        for (let span of spanNodes) {
                            let wBegin = parseTime(span.getAttribute('begin'));
                            let wEnd = parseTime(span.getAttribute('end'));
                            let wText = span.textContent;
                            if (!isNaN(wBegin)) {
                                words.push({ begin: wBegin, end: wEnd, text: wText });
                            }
                        }
                    }
                    
                    if (words.length > 0) {
                        linesData.push({ begin: lineBegin, end: lineEnd, words: words });
                    }
                }

                // Запускаем караоке автоматически сразу после загрузки файла!
                startAutoPlayback();
            })
            .catch(err => {
                console.error("Не удалось загрузить lyrics.ttml", err);
                lyricsEl.innerHTML = `<span style="color: #f85149;">Ошибка: файл lyrics.ttml не найден</span>`;
            });

        function startAutoPlayback() {
            if (isStarted) return;
            isStarted = true;
            startTime = Date.now();
            
            setInterval(() => {
                let currentTime = (Date.now() - startTime) / 1000;
                
                let currentLine = linesData.find(line => currentTime >= line.begin && currentTime <= line.end);
                
                if (currentLine) {
                    let html = '';
                    currentLine.words.forEach(w => {
                        let isActive = currentTime >= w.begin && currentTime <= (w.end || w.begin + 0.4);
                        let activeClass = isActive ? 'word active' : 'word';
                        html += `<span class="${activeClass}">${w.text}</span> `;
                    });
                    lyricsEl.innerHTML = html;
                } else {
                    lyricsEl.innerHTML = `<span style="color: #484f58;">...</span>`;
                }
            }, 50);
        }
    </script>

</body>
</html>
