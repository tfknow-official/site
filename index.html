<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tfknow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(rgba(13, 17, 23, 0.85), rgba(13, 17, 23, 0.95)), 
                        url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
        }
        .avatar-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #58a6ff;
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.3);
            background: #21262d;
        }
        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            color: #f0f6fc;
            font-size: 1.6rem;
            margin-bottom: 5px;
        }
        .tagline {
            color: #8b949e;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        .views-counter {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(13, 17, 23, 0.7);
            border: 1px solid #30363d;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #8b949e;
            margin-bottom: 20px;
        }
        .views-counter svg {
            width: 16px;
            height: 16px;
            fill: #58a6ff;
        }
        .views-counter span {
            color: #f0f6fc;
            font-weight: bold;
        }
        .player-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
        }
        .lyrics-container {
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            color: #8b949e;
            text-align: center;
            padding: 0 10px;
            margin-bottom: 15px;
        }
        .active-line {
            color: #58a6ff;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.4);
        }
        .play-btn {
            background: #21262d;
            color: #f0f6fc;
            border: 1px solid #30363d;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .play-btn:hover {
            background: #30363d;
            border-color: #8b949e;
        }
        footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #484f58;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="avatar-container">
            <img src="https://github.com/tfknow.png" alt="Аватарка tfknow">
        </div>

        <h1>tfknow</h1>
        <div class="tagline">Разработчик • Автоматизация • TTML</div>
        
        <div class="views-counter">
            <svg viewBox="0 0 24 24">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
            <span id="view-count">1</span>
        </div>

        <div class="player-box">
            <div class="lyrics-container" id="lyrics">
                <span class="active-line">Нажмите «Старт», чтобы запустить текст</span>
            </div>
            <button class="play-btn" id="playBtn">▶ Старт</button>
        </div>

        <footer>
            &copy; 2026 tfknow
        </footer>
    </div>

    <script>
        // Счётчик просмотров
        fetch('https://api.counterapi.dev/v1/tfknow_site/visits/up')
            .then(res => res.json())
            .then(data => {
                if (data && data.count) {
                    document.getElementById('view-count').textContent = data.count;
                }
            })
            .catch(() => {});

        let lyricsData = [];
        const lyricsEl = document.getElementById('lyrics');
        const playBtn = document.getElementById('playBtn');
        let isPlaying = false;
        let startTime = 0;
        let timerInterval = null;

        // Сдвигаем тайминги с нуля, чтобы текст шел сразу при нажатии старта
        const ttmlString = `<?xml version="1.0" encoding="UTF-8"?>
        <tt xmlns="http://www.w3.org/ns/ttml">
        <body>
            <div>
                <p begin="0" end="4"><span>society desperate for remedy</span>[span_0](start_span)[span_0](end_span)</p>
                <p begin="4" end="8"><span>empathy, fix this reality</span>[span_1](start_span)[span_1](end_span)</p>
                <p begin="8" end="12"><span>you know i don't believe i belong</span>[span_2](start_span)[span_2](end_span)</p>
                <p begin="12" end="16"><span>gimme something to love</span>[span_3](start_span)[span_3](end_span)</p>
                <p begin="16" end="20"><span>gimme something overwhelming</span>[span_4](start_span)[span_4](end_span)</p>
                <p begin="20" end="24"><span>buy the ticket, take the ride</span>[span_5](start_span)[span_5](end_span)</p>
                <p begin="24" end="28"><span>kiss me like you know this is goodbye</span>[span_6](start_span)[span_6](end_span)</p>
                <p begin="28" end="32"><span>we could try to make it all the way out</span>[span_7](start_span)[span_7](end_span)</p>
                <p begin="32" end="36"><span>grab me like my life is on the line</span>[span_8](start_span)[span_8](end_span)</p>
            </div>
        </body>
        </tt>`;

        try {
            const parser = new window.DOMParser();
            const xmlDoc = parser.parseFromString(ttmlString, "text/xml");
            const pNodes = xmlDoc.getElementsByTagName('p');
            for (let p of pNodes) {
                let begin = parseFloat(p.getAttribute('begin'));
                let end = parseFloat(p.getAttribute('end'));
                let text = p.textContent ? p.textContent.trim() : '';
                lyricsData.push({ begin, end, text });
            }
        } catch (e) {
            console.error("Ошибка парсинга", e);
        }

        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                isPlaying = true;
                playBtn.textContent = "⏸ Сбросить";
                startTime = Date.now();
                
                timerInterval = setInterval(() => {
                    let currentTime = (Date.now() - startTime) / 1000;
                    
                    let currentLine = lyricsData.find(item => currentTime >= item.begin && currentTime <= item.end);
                    if (currentLine) {
                        lyricsEl.innerHTML = `<span class="active-line">${currentLine.text}</span>`;
                    }
                    
                    if (currentTime > 40) {
                        stopTimer();
                    }
                }, 100);
            } else {
                stopTimer();
            }
        });

        function stopTimer() {
            isPlaying = false;
            clearInterval(timerInterval);
            playBtn.textContent = "▶ Старт";
            lyricsEl.innerHTML = `<span class="active-line">Нажмите «Старт», чтобы запустить текст</span>`;
        }
    </script>

</body>
</html>
