<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tf.know | Профиль</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        h1 {
            color: #f0f6fc;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .tagline {
            color: #8b949e;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        a.btn {
            display: inline-block;
            background: #21262d;
            color: #f0f6fc;
            border: 1px solid #30363d;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        a.btn:hover {
            background: #30363d;
            border-color: #8b949e;
            transform: translateY(-2px);
        }
        .counter-box {
            background: #0d1117;
            border: 1px solid #30363d;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #8b949e;
            display: inline-block;
        }
        .counter-box span {
            color: #58a6ff;
            font-weight: bold;
        }
        footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #484f58;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>tf.know</h1>
        <div class="tagline">Разработчик • Автоматизация • TTML & Проекты</div>
        
        <div class="links">
            <a href="https://github.com/tfknow_official" class="btn" target="_blank">GitHub Профиль</a>
        </div>

        <div class="counter-box">
            👀 Просмотров сайта: <span id="view-count">загрузка...</span>
        </div>

        <footer>
            &copy; 2026 tf.know. Все права защищены.
        </footer>
    </div>

    <script>
        // Автоматический счётчик просмотров через публичное API
        fetch('https://api.counterapi.dev/v1/tfknow/site_visits/up')
            .then(response => response.json())
            .then(data => {
                document.getElementById('view-count').textContent = data.count;
            })
            .catch(error => {
                document.getElementById('view-count').textContent = 'доступно';
            });
    </script>

</body>
</html>
