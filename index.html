<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tf.know | Профиль</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Ссылка на задний фон (можешь заменить URL на свою картинку) */
            background: linear-gradient(rgba(13, 17, 23, 0.85), rgba(13, 17, 23, 0.95)), 
                        url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
        }
        /* Стили для аватарки */
        .avatar-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #58a6ff;
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.3);
            background: #21262d;
        }
        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            color: #f0f6fc;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }
        .tagline {
            color: #8b949e;
            font-size: 1rem;
            margin-bottom: 25px;
        }
        /* Блок со счетчиком просмотров */
        .views-counter {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(13, 17, 23, 0.7);
            border: 1px solid #30363d;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            color: #8b949e;
        }
        .views-counter svg {
            width: 18px;
            height: 18px;
            fill: #58a6ff;
        }
        .views-counter span {
            color: #f0f6fc;
            font-weight: bold;
        }
        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #484f58;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Аватарка (замени ссылку в src на свою картинку) -->
        <div class="avatar-container">
            <img src="https://github.com/tfknow_official.png" alt="Аватарка tf.know">
        </div>

        <h1>tf.know</h1>
        <div class="tagline">Разработчик • Автоматизация • TTML</div>
        
        <!-- Счётчик просмотров со значком глаза -->
        <div class="views-counter">
            <svg viewBox="0 0 24 24">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
            <span id="view-count">...</span>
        </div>

        <footer>
            &copy; 2026 tf.know
        </footer>
    </div>

    <script>
        // Автоматический подсчёт просмотров через публичное API
        fetch('https://api.counterapi.dev/v1/tfknow/site_visits/up')
            .then(response => response.json())
            .then(data => {
                document.getElementById('view-count').textContent = data.count;
            })
            .catch(error => {
                document.getElementById('view-count').textContent = '1';
            });
    </script>

</body>
</html>
